name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        numpy: ["numpy"]
        include:
          - os: ubuntu-latest
            python: "3.12"
            numpy: "numpy<2"
          - os: macos-latest
            python: "3.13"
            numpy: "numpy"
          - os: windows-latest
            python: "3.13"
            numpy: "numpy"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Install from the sdist, in an isolated build: this checks MANIFEST.in
      # and the build requirements of pyproject.toml as well.
      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist
      - name: Install the sdist
        shell: bash
        run: python -m pip install "${{ matrix.numpy }}" scipy pytest dist/*.tar.gz
      # Run outside the checkout, so that the installed (compiled) module is
      # the one imported.
      - name: Test
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python -m pytest -q --import-mode=importlib "$GITHUB_WORKSPACE/tests"
